# Builds the Docker image when a release tag (v1.2.3) is pushed, and publishes it to GitHub's container registry as
# ghcr.io/<owner>/music-bingo (for amd64 and arm64, so it also runs on a Raspberry Pi).
name: Publish Docker image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # also runnable by hand: Actions tab > Publish Docker image > Run workflow
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/music-bingo
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
